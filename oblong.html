<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ✨</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
            text-align: center;
            backdrop-filter: blur(5px);
        }
        h1 { color: #d63384; margin-bottom: 10px; }
        p { font-size: 1.1em; line-height: 1.5; color: #555; }
        .btn {
            background-color: #d63384;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            margin-top: 15px;
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn:hover {
            background-color: #b8256f;
            transform: scale(1.05);
        }
        #message {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #ffe6ed;
            border-radius: 12px;
            color: #b8256f;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Hi there! 👋</h1>
        <p>Welcome to your official evaluation page. Press the button below to see your status.</p>
        
        <button class="btn" onclick="showMessage()">Check Status</button>

        <div id="message">
            Application Status: Pending... but you're currently in 1st place! 😉
        </div>
    </div>

    <script>
        function showMessage() {
            var msg = document.getElementById("message");
            msg.style.display = "block";
        }
    </script>

</body>
</html>
